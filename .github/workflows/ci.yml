name: CI

on:
  push:
    branches: [main, "phase3-**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend/src backend/tests
      - run: ruff format --check backend/src backend/tests
      - run: cd backend && mypy src --ignore-missing-imports
      - name: Run tests
        env:
          ENVIRONMENT: test
          AUTH_MODE: mock
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: test-medicare
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
          FIREBASE_PROJECT_ID: test
          FIREBASE_CLIENT_EMAIL: test@test.com
          FIREBASE_PRIVATE_KEY: test
          ANTHROPIC_API_KEY: test
        run: cd backend && pytest -q

  ios-build-test:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Build iOS app
        run: |
          xcodebuild \
            -project ios/MediCareAI.xcodeproj \
            -scheme MediCareAI \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Pick an available iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r), reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")))
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Run iOS tests
        run: |
          xcodebuild \
            -project ios/MediCareAI.xcodeproj \
            -scheme MediCareAI \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -configuration Debug \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Export screenshots
        if: always()
        run: |
          OUT="$RUNNER_TEMP/screenshots"
          mkdir -p "$OUT"
          if [ -d "$RUNNER_TEMP/TestResults.xcresult" ]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/TestResults.xcresult" \
              --output-path "$OUT" || echo "No attachments exported"
            python3 .github/scripts/name_screenshots.py "$OUT"
          fi
          ls -la "$OUT"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
      - name: Upload the generated Xcode project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodeproj
          path: |
            ios/MediCareAI.xcodeproj/project.pbxproj
            ios/MediCareAI/Info.plist
