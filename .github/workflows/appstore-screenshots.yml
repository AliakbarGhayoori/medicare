name: App Store screenshots

# Renders the light-mode screens from ScreenshotTests on a 6.9-inch iPhone with a clean
# status bar, for the App Store listing. Run by hand: gh workflow run appstore-screenshots.yml
on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Boot a 6.9-inch iPhone with a clean status bar
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r), reverse=True)
          print(next((d["udid"] for r in runtimes for d in devices[r] if d["name"] == "iPhone 17 Pro Max"), ""))
          ')
          if [ -z "$UDID" ]; then
            RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          runtimes = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          print(sorted(runtimes, key=lambda r: [int(p) for p in r["version"].split(".")])[-1]["identifier"])
          ')
            UDID=$(xcrun simctl create "iPhone 17 Pro Max" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max "$RUNTIME")
          fi
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --operatorName "" \
            --batteryState discharging --batteryLevel 100
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Render the screens
        run: |
          xcodebuild \
            -project ios/MediCareAI.xcodeproj \
            -scheme MediCareAI \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -configuration Debug \
            -resultBundlePath "$RUNNER_TEMP/Screens.xcresult" \
            -only-testing:MediCareAIUITests/ScreenshotTests/testLightScreens \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Export screenshots
        if: always()
        run: |
          OUT="$RUNNER_TEMP/appstore"
          mkdir -p "$OUT"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/Screens.xcresult" \
            --output-path "$OUT" || echo "No attachments exported"
          python3 .github/scripts/name_screenshots.py "$OUT"
          ls -la "$OUT"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appstore-screenshots
          path: ${{ runner.temp }}/appstore
          if-no-files-found: warn
