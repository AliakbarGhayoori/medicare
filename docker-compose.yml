# Local development only: MongoDB plus the backend image.
#
#   cp backend/.env.live.example backend/.env.live   # then fill in keys
#   docker compose up -d
#
# Production uses docker-compose.prod.yml (see DEPLOY.md). The project name below
# keeps this stack apart from production's "medicare" project and its data volume.
name: medicare-dev

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-localdev}
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: backend/.env.live
        required: false
    environment:
      # Inside the container MongoDB is reached by its service name, not localhost.
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-localdev}@mongo:27017/medicare-ai?authSource=admin
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
