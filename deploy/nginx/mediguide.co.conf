# Live copy of /etc/nginx/sites-available/mediguide-website (mediguide.co).
# Serves the static marketing site straight from /root/medicare/website.
# Keep this file in sync when editing the live one.

server {
    server_name mediguide.co;

    root /root/medicare/website;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Cache static assets
    location ~* \.(png|jpg|jpeg|gif|ico|svg|css|js|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # error_page 404 /index.html;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mediguide.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mediguide.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = mediguide.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name mediguide.co;
    return 404; # managed by Certbot


}
